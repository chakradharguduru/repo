name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit + integration + non-live e2e tests with coverage
        # No GROQ_API_KEY / CONFLUENCE_* secrets are configured here.
        # @pytest.mark.live tests are excluded by default (see the `addopts`
        # in pyproject.toml), so the rest of the suite runs fully
        # mocked/offline and needs no secrets at all. Coverage fails the
        # build below pyproject.toml's [tool.coverage.report] fail_under.
        run: |
          pytest --cov=. --cov-report=term-missing --cov-report=html --cov-report=xml

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/

      - name: Upload XML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
